---
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      llmProvider:
        type: string
        title: LLM Provider
        description: >-
          LLM provider to use (openai, anthropic, ollama).
          Default: openai
        enum:
          - openai
          - anthropic
          - ollama
      embeddingProvider:
        type: string
        title: Embedding Provider
        description: >-
          Embedding provider to use (local, openai).
          Default: local
        enum:
          - local
          - openai
      openaiApiKey:
        type: string
        title: OpenAI API Key
        description: >-
          OpenAI API key for embeddings and/or LLM generation
      anthropicApiKey:
        type: string
        title: Anthropic API Key
        description: >-
          Anthropic API key for Claude LLM generation
    required: []
  commandFunction:
    command: uvx
    args:
      - local-deepwiki
    env:
      DEEPWIKI_LLM_PROVIDER: "{{config.llmProvider}}"
      DEEPWIKI_EMBEDDING_PROVIDER: "{{config.embeddingProvider}}"
      OPENAI_API_KEY: "{{config.openaiApiKey}}"
      ANTHROPIC_API_KEY: "{{config.anthropicApiKey}}"
